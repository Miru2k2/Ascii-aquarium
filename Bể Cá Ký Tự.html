<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bể Cá Ký Tự - ASCII Aquarium</title>
<style>
:root{color-scheme:dark;--bg:#04122e;--ink:#7df3ff;--dim:#4a7fa8;--acc:#ffd24a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Courier New",ui-monospace,monospace;overflow:hidden}
body{display:flex;flex-direction:column}
button{font:inherit;font-weight:700;color:var(--bg);background:var(--ink);border:0;padding:9px 13px;border-radius:8px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--dim)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
body[data-dev=phone] button,body[data-dev=tablet] button{min-height:44px}
#top{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
#panel{display:none;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px 12px;padding:4px 12px 8px;font-size:14px}
#panel.open{display:grid}
.chip{display:flex;align-items:center;gap:8px}
.chip label{flex:1;display:flex;gap:6px;align-items:center}
.chip button{padding:4px 12px;min-height:34px}
.chip b{min-width:1.4em;text-align:center}
#acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
canvas{flex:1;width:100%;min-height:0;display:block;touch-action:none}
.ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 30%,#0a3a7a,#04122e 70%);overflow:hidden}
.ov.hide{display:none}
.ov h1{font-size:clamp(30px,8vw,64px);margin:0;letter-spacing:.05em;animation:fl 4s ease-in-out infinite}
.ov h2{font-size:clamp(18px,4vw,30px);margin:6px 0 18px;color:var(--acc);font-weight:400}
.ov p{max-width:34em;margin:4px 0;color:#a9d6f0;line-height:1.5}
.ov button{margin-top:22px;font-size:18px;padding:12px 26px;z-index:1}
.sw{position:absolute;left:0;white-space:nowrap;opacity:.6;font-size:clamp(18px,4vw,30px);font-weight:700;animation:swr 16s linear infinite}
.sw.l{animation-name:swl}
.bb{position:absolute;bottom:-30px;color:#a0e6ff;opacity:.6;animation:rise 9s linear infinite}
.wv{display:inline-block;transform-origin:20% 80%;animation:wv 1.2s ease-in-out infinite;font-size:clamp(24px,6vw,44px);font-weight:700;margin:14px 0}
@keyframes swr{from{transform:translateX(-120%)}to{transform:translateX(100vw)}}
@keyframes swl{from{transform:translateX(100vw)}to{transform:translateX(-120%)}}
@keyframes rise{to{transform:translateY(-110vh)}}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes wv{50%{transform:rotate(-12deg)}}
@media (prefers-reduced-motion:reduce){.sw,.bb,.ov h1,.wv{animation:none}}
</style>
</head>
<body>
<div id="top">
<button id="feed">Thả thức ăn</button>
<button id="tg" class="alt">Điều khiển</button>
<button id="end" class="alt">Kết thúc</button>
</div>
<div id="panel"></div>
<canvas id="cv"></canvas>

<div id="welcome" class="ov">
<h1>Bể Cá Ký Tự</h1>
<h2>ASCII Aquarium</h2>
<p>Chào mừng bạn đến với bể cá ảo của riêng mình.</p>
<p>Welcome to your very own virtual fish tank.</p>
<p>Kéo thả sinh vật, chạm bong bóng, chăm rong.<br>Drag creatures, pop bubbles, tend the weed.</p>
<button id="start">Bắt đầu / Start</button>
</div>

<div id="bye" class="ov hide">
<h1>Goodbye, user</h1>
<h2>Tạm biệt người dùng</h2>
<div class="wv">&lt;&bull;))&gt;&lt; ~</div>
<button id="replay">Replay / Chơi lại</button>
</div>

<script>
const $=s=>document.querySelector(s),cv=$("#cv"),ctx=cv.getContext("2d");
const R=(a,b)=>a+Math.random()*(b-a);
const SP=[
{k:"fish",n:"Cá chính",max:5,def:1,col:"#7df3ff",sz:1.5,hit:2.3,z:[.12,.65],s:3.2},
{k:"small",n:"Cá nhỏ",max:6,def:5,col:"#ff9bd2",sz:.8,hit:1.4,z:[.18,.7],s:2},
{k:"jelly",n:"Sứa",max:3,def:2,col:"#c58bff",sz:1,hit:1.8,z:[.08,.5],s:.7},
{k:"crab",n:"Cua",max:3,def:1,col:"#ff6b5a",sz:1,hit:1.8,s:3},
{k:"snail",n:"Ốc",max:5,def:2,col:"#ffb36b",sz:1,hit:1.2,s:.5}];
let L={},on={},food=[],bub=[],part=[],hearts=[],weed=[],W=0,H=0,fs=20,ground=0,t=0,run=false,raf=0,drag=null,gl=1,last=0;

// ---------- decorative overlays ----------
function deco(el){let h="";for(let i=0;i<5;i++){const r=i%2;h+=`<span class="sw ${r?"l":""}" style="top:${8+i*17}%;animation-duration:${12+i*3}s;animation-delay:-${i*4}s;color:${["#7df3ff","#ff9bd2","#c58bff","#b5ff4a","#ffb36b"][i]}">${r?"&lt;&bull;)))&gt;&lt;":"&gt;&lt;(((&bull;&gt;"}</span>`}
for(let i=0;i<8;i++)h+=`<span class="bb" style="left:${5+i*12}%;animation-delay:-${i*1.1}s;animation-duration:${7+i%3*2}s">${i%2?"o":"O"}</span>`;
el.insertAdjacentHTML("afterbegin",h)}
deco($("#welcome"));deco($("#bye"));

// ---------- controls ----------
$("#panel").innerHTML=SP.map(s=>`<div class="chip"><label><input type="checkbox" data-k="${s.k}" checked><span style="color:${s.col}">${s.n}</span></label><button class="alt" data-d="${s.k}:-1" aria-label="Giảm ${s.n}">-</button><b id="n_${s.k}">0</b><button class="alt" data-d="${s.k}:1" aria-label="Thêm ${s.n}">+</button></div>`).join("")
+`<div class="chip"><label><input type="checkbox" data-k="weed" checked><span style="color:#2fbf6a">Rong rêu</span></label></div><div class="chip"><label><input type="checkbox" data-k="bub" checked><span style="color:#a0e6ff">Bong bóng</span></label></div><div id="acts"><button data-a="def">Mặc định</button><button data-a="empty" class="alt">Bể trống</button><button data-a="full" class="alt">Tất cả</button></div>`;
function sync(){SP.forEach(s=>$("#n_"+s.k).textContent=L[s.k].length);$("#panel").querySelectorAll("input").forEach(i=>i.checked=!!on[i.dataset.k])}
$("#panel").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.d){const[k,d]=b.dataset.d.split(":");setN(k,L[k].length+ +d)}
 else if(b.dataset.a){const a=b.dataset.a;if(a=="def")reset();else{SP.forEach(s=>{on[s.k]=true;setN(s.k,a=="full"?s.max:0)});on.weed=on.bub=a=="full";if(a=="empty"){food=[];bub=[]}}}
 sync()};
$("#panel").onchange=e=>{on[e.target.dataset.k]=e.target.checked};
$("#tg").onclick=()=>$("#panel").classList.toggle("open");
$("#feed").onclick=()=>drop();
addEventListener("keydown",e=>{if(run&&(e.code=="Space"||e.key=="f")){e.preventDefault();drop()}});
function drop(){for(let i=0;i<5&&food.length<30;i++)food.push({x:R(.06,.94)*W,y:-R(0,50),ph:R(0,6),age:0})}

// ---------- world ----------
function mk(s){const g=!s.z;return{x:R(.1,.9)*W,y:g?ground:R(s.z[0],s.z[1])*H,vx:0,vy:0,dir:Math.random()<.5?1:-1,tx:W/2,ty:H/2,wt:0,ph:R(0,6),mv:false,drag:false}}
function setN(k,n){const s=SP.find(q=>q.k==k);n=Math.max(0,Math.min(s.max,n));while(L[k].length<n)L[k].push(mk(s));while(L[k].length>n)L[k].pop();$("#n_"+k).textContent=n}
function reset(){food=[];bub=[];part=[];hearts=[];drag=null;
 SP.forEach(s=>{L[s.k]=[];on[s.k]=true;setN(s.k,s.def)});on.weed=on.bub=true;
 weed=Array.from({length:9},(_,i)=>({x:(i+.5)/9,h:Math.round(R(4,8)),ph:R(0,6)}));sync()}
function rs(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
 const po=H>W,dev=po?(W<600?"phone":"tablet"):(W>=1280?"desktop":"tablet");document.body.dataset.dev=dev;
 const cap={phone:26,tablet:30,desktop:34}[dev];fs=Math.max(14,Math.min(cap,po?W/14:Math.min(W/32,H/18)));ground=H-fs*1.4;gl=dev=="phone"?.5:1}
addEventListener("resize",rs);rs();

function step(s,c,dt){
 if(c.drag)return;const g=!s.z;let tg=null,bd=1e9;
 if(s.k=="fish"||s.k=="small"||g)for(const o of food){if(g&&o.y<ground-2)continue;const d=Math.hypot(o.x-c.x,o.y-c.y);if(d<bd&&(!g||d<W*.45)){bd=d;tg=o}}
 let sp=fs*s.s;
 if(g){
  c.y+=(ground-c.y)*Math.min(1,dt*6);
  if(tg){c.tx=tg.x;sp*=2}else{c.wt-=dt;if(c.wt<=0){c.mv=!c.mv;c.wt=c.mv?R(1.5,4):R(1,3);c.tx=R(.08,.92)*W}}
  const dx=c.tx-c.x;c.moving=(tg||c.mv)&&Math.abs(dx)>3;
  if(c.moving){c.dir=Math.sign(dx);c.x+=c.dir*sp*(s.k=="crab"?1+.8*Math.sin(t*6+c.ph):1)*dt}
 }else{
  if(tg){c.tx=tg.x;c.ty=tg.y;sp*=1.8}else{c.wt-=dt;if(c.wt<=0){c.tx=R(.08,.92)*W;c.ty=R(s.z[0],s.z[1])*H;c.wt=R(2.5,6)}}
  const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/(fs*2));
  c.vx+=(dx/d*sp*k-c.vx)*dt*2;c.vy+=(dy/d*sp*k-c.vy)*dt*2;c.x+=c.vx*dt;c.y+=c.vy*dt;
  if(Math.abs(c.vx)>3)c.dir=c.vx>0?1:-1;
  c.y=Math.max(fs,Math.min(ground-fs,c.y));
  if(s.k=="fish"&&on.bub&&Math.random()<dt*.6)bub.push({x:c.x+c.dir*fs*2.2,y:c.y-4,s:R(.4,.9)});
 }
 c.x=Math.max(fs*2,Math.min(W-fs*2,c.x));
}
function upd(dt){t+=dt;
 for(const s of SP){if(!on[s.k])continue;for(const c of L[s.k]){step(s,c,dt);if(c.drag)continue;
  for(let i=food.length-1;i>=0;i--){const o=food[i];if(Math.hypot(o.x-c.x,o.y-c.y)<fs*(s.k=="fish"?1.6:1.1)){food.splice(i,1);hearts.push({x:c.x,y:c.y-fs,l:1.5});break}}}}
 for(const o of food){o.age+=dt;if(o.y<ground){o.y=Math.min(ground,o.y+fs*1.6*dt);o.x+=Math.sin(t*2+o.ph)*dt*8}}
 food=food.filter(o=>o.age<30);
 if(on.bub&&Math.random()<dt*1.2)bub.push({x:R(0,W),y:ground,s:R(.4,.9)});
 for(const b of bub){b.y-=fs*2.2*dt*b.s;b.x+=Math.sin(t*3+b.y*.05)*dt*10}
 bub=bub.filter(b=>b.y>-10);
 for(const h of hearts){h.y-=fs*2*dt;h.l-=dt}hearts=hearts.filter(h=>h.l>0);
 for(const p of part){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}part=part.filter(p=>p.l>0)}

// ---------- drawing ----------
function tx(s,x,y,c,sz,glow){ctx.font="bold "+sz+"px 'Courier New',monospace";ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=(glow===undefined?8:glow)*gl;ctx.fillText(s,x,y)}
function art(k,c,col){const f=Math.floor(t*3+c.ph)%2,r=c.dir>0;
 if(k=="fish"){const e=Math.floor(t*.7+c.ph)%7==0?"-":"\u2022";return r?"><(((" +e+">":"<"+e+")))><"}
 if(k=="small")return r?"><>":"<><";
 if(k=="snail")return r?"@_/":"\\_@";
 if(k=="crab"){if(c.moving)return f?"/(o_o)\\":"_(o_o)_";const w=Math.floor(t*2+c.ph)%4;return w==3?"V(-_-)V":w%2?"\\(o_o)/":"V(o_o)V"}}
function draw(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#06214d");g.addColorStop(1,"#020a1c");
 ctx.shadowBlur=0;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.textBaseline="middle";
 let sand="";for(let i=0;i<Math.ceil(W/(fs*.6))+2;i++)sand+=i%3?".":":";
 tx(sand,W/2,ground+fs*.7,"#6b5a2e",fs*.9,0);tx(sand,W/2,ground+fs*1.5,"#4a3f20",fs*.9,0);
 if(on.weed)for(const w of weed){const bx=w.x*W;for(let i=0;i<w.h;i++){const o=Math.sin(t*1.3+w.ph+i*.6)*fs*.45*(i/w.h+.3);tx(i%2?")":"(",bx+o,ground-i*fs*.85,"#2fbf6a",fs*1.1,6)}}
 for(const s of SP){if(!on[s.k])continue;for(const c of L[s.k]){
  if(s.k=="jelly"){const y=c.y+Math.sin(t*.7+c.ph)*fs*.4;tx(".-^-.",c.x,y,s.col,fs,10);tx("(@@@)",c.x,y+fs*.9,s.col,fs,10);tx(Math.floor(t*2+c.ph)%2?"/|\\|/":"\\|/|\\",c.x,y+fs*1.9,s.col,fs*.9,6)}
  else{const y=s.z?c.y+Math.sin(t*2+c.x*.01)*fs*.25:c.y;tx(art(s.k,c),c.x,y,s.col,fs*s.sz,s.k=="fish"?14:8)}
  if(c.drag)tx("^",c.x,c.y-fs*1.6,"#ffd24a",fs,0)}}
 if(on.bub)for(const b of bub)tx(b.s>.7?"O":b.s>.45?"o":".",b.x,b.y,"rgba(160,230,255,.8)",fs*b.s,4);
 for(const o of food)tx("*",o.x,o.y,"#ffd24a",fs*1.1,8);
 for(const h of hearts)tx("\u2665",h.x,h.y,"#ff6b9a",fs,8);
 for(const p of part)tx(p.ch,p.x,p.y,"rgba(190,240,255,"+Math.max(0,p.l*2)+")",fs*.7,0);
 ctx.shadowBlur=0}

// ---------- interaction ----------
function pop(b){bub.splice(bub.indexOf(b),1);for(let i=0;i<7;i++)part.push({x:b.x,y:b.y,vx:R(-1,1)*fs*3,vy:R(-1,1)*fs*3,l:.5,ch:i%2?"*":"o"})}
cv.addEventListener("pointerdown",e=>{if(!run)return;const x=e.offsetX,y=e.offsetY;let best=null,bd=1e9;
 for(const s of SP){if(!on[s.k])continue;for(const c of L[s.k]){const d=Math.hypot(c.x-x,c.y-y);if(d<s.hit*fs&&d<bd){bd=d;best=c}}}
 if(best){drag=best;best.drag=true;best.vx=best.vy=0;cv.setPointerCapture(e.pointerId);return}
 if(on.bub)for(const b of bub)if(Math.hypot(b.x-x,b.y-y)<fs*(.5+b.s*.5)+8){pop(b);return}
 if(on.weed)for(const w of weed){const tip=ground-(w.h-1)*fs*.85;
  if(Math.abs(x-w.x*W)<fs*.9&&y<ground+fs&&y>tip-fs){w.h=y<tip+fs*.7?Math.max(2,w.h-1):Math.min(12,w.h+1);return}}});
cv.addEventListener("pointermove",e=>{if(drag){drag.x=e.offsetX;drag.y=e.offsetY}});
const rel=()=>{if(drag){drag.drag=false;drag.wt=0;drag=null}};
cv.addEventListener("pointerup",rel);cv.addEventListener("pointercancel",rel);

// ---------- flow ----------
function loop(n){if(!run)return;const dt=Math.min(.05,(n-last)/1000);last=n;upd(dt);draw();raf=requestAnimationFrame(loop)}
function go(){rs();reset();run=true;last=performance.now();raf=requestAnimationFrame(loop)}
$("#start").onclick=()=>{$("#welcome").classList.add("hide");go()};
$("#end").onclick=()=>{run=false;cancelAnimationFrame(raf);$("#bye").classList.remove("hide")};
$("#replay").onclick=()=>{$("#bye").classList.add("hide");go()};
reset();
</script>
</body>
</html>
